<style>
:root {
  --primary: #378ADD;
  --primary-dark: #185FA5;
  --primary-light: #E6F1FB;
  --primary-border: #B5D4F4;
  --teal: #0F6E56;
  --teal-light: #E1F5EE;
  --teal-border: #9FE1CB;
  --text-primary: #1a1a1a;
  --text-secondary: #555;
  --text-tertiary: #999;
  --border: #e8e8e8;
  --border-light: #f0f0f0;
  --bg: #fafafa;
  --bg-card: #ffffff;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text-primary);min-height:100vh;padding-bottom:3rem;}
.header{background:white;border-bottom:0.5px solid var(--border);padding:1rem 1.5rem;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;}
.header-logo{font-family:'Shippori Mincho',serif;font-size:16px;font-weight:600;color:var(--primary-dark);letter-spacing:0.05em;}
.header-sub{font-size:11px;color:var(--text-tertiary);border-left:1px solid var(--border);padding-left:10px;margin-left:2px;}
.main{max-width:560px;margin:0 auto;padding:2rem 1rem;}
.age-intro{text-align:center;margin-bottom:2rem;padding:2rem 1rem 1rem;}
.age-intro-title{font-family:'Shippori Mincho',serif;font-size:26px;font-weight:600;color:var(--text-primary);line-height:1.6;margin-bottom:0.75rem;}
.age-intro-sub{font-size:14px;color:var(--text-secondary);line-height:1.7;}
.age-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.5rem;}
.age-btn{background:white;border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem 1rem;cursor:pointer;text-align:center;transition:all 0.2s;box-shadow:0 1px 4px rgba(0,0,0,0.04);}
.age-btn:hover{border-color:var(--primary-border);box-shadow:0 4px 12px rgba(55,138,221,0.12);transform:translateY(-1px);}
.age-btn .age-main{font-size:20px;font-weight:700;color:var(--text-primary);display:block;margin-bottom:4px;}
.age-btn .age-sub{font-size:12px;color:var(--text-tertiary);}
.q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem;}
.q-label{font-size:12px;color:var(--text-tertiary);}
.prog-bg{height:3px;background:var(--border-light);border-radius:2px;margin-bottom:2rem;overflow:hidden;}
.prog-fill{height:3px;background:linear-gradient(90deg,var(--primary-border),var(--primary));border-radius:2px;transition:width 0.4s ease;}
.q-text{font-size:18px;font-weight:500;color:var(--text-primary);line-height:1.65;margin-bottom:1.75rem;}
.choices{display:flex;flex-direction:column;gap:10px;}
.choice-btn{background:white;border:0.5px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;font-size:14px;font-family:'Noto Sans JP',sans-serif;color:var(--text-primary);cursor:pointer;text-align:left;line-height:1.5;transition:all 0.15s;}
.choice-btn:hover{border-color:var(--primary-border);background:var(--primary-light);}
.choice-btn.sel{border:1.5px solid var(--primary);background:var(--primary-light);color:var(--primary-dark);font-weight:500;}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:1.75rem;}
.nav-btn{background:transparent;border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:9px 20px;font-size:13px;font-family:'Noto Sans JP',sans-serif;color:var(--text-secondary);cursor:pointer;transition:all 0.15s;}
.nav-btn:hover{background:var(--border-light);}
.nav-btn:disabled{opacity:0.3;cursor:default;}
.nav-btn.primary{background:var(--primary);border-color:var(--primary);color:white;font-weight:500;}
.nav-btn.primary:hover{background:var(--primary-dark);}
.nav-btn.primary:disabled{opacity:0.4;cursor:default;}
.result-hero{background:white;border:0.5px solid var(--border);border-radius:var(--radius-xl);padding:1.75rem;margin-bottom:1rem;box-shadow:0 2px 12px rgba(0,0,0,0.04);}
.result-top{display:flex;align-items:center;gap:12px;margin-bottom:1.25rem;}
.result-icon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.result-icon.blue{background:var(--primary-light);color:var(--primary);}
.result-icon.teal{background:var(--teal-light);color:var(--teal);}
.result-badge{display:inline-block;font-size:10px;letter-spacing:0.1em;border-radius:20px;padding:2px 10px;margin-bottom:5px;}
.result-badge.blue{background:var(--primary-light);color:var(--primary-dark);}
.result-badge.teal{background:var(--teal-light);color:var(--teal);}
.result-type{font-family:'Shippori Mincho',serif;font-size:20px;font-weight:600;color:var(--text-primary);line-height:1.3;}
.section{margin-bottom:1.25rem;}
.sec-label{font-size:10px;letter-spacing:0.12em;color:var(--text-tertiary);margin-bottom:6px;}
.desc-text{font-size:14px;color:var(--text-secondary);line-height:1.8;}
.advice-box{background:var(--bg);border-radius:var(--radius-sm);padding:1rem 1.1rem;font-size:14px;color:var(--text-secondary);line-height:1.8;border-left:3px solid var(--primary-border);}
.divider{height:0.5px;background:var(--border-light);margin:1.25rem 0;}
.lesson-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px;}
.lt{font-size:12px;border-radius:20px;padding:5px 13px;border:0.5px solid var(--border);}
.lt.mine{background:var(--primary-light);color:var(--primary-dark);border-color:var(--primary-border);font-weight:500;}
.lt.gentle{background:var(--teal-light);color:var(--teal);border-color:var(--teal-border);font-weight:500;}
.lt.other{background:var(--bg);color:var(--text-secondary);}
.reason-card{background:var(--bg);border-radius:var(--radius-md);padding:1rem 1.1rem;margin-bottom:8px;}
.reason-name{font-size:13px;font-weight:500;color:var(--primary-dark);margin-bottom:5px;}
.reason-name.teal{color:var(--teal);}
.reason-body{font-size:13px;color:var(--text-secondary);line-height:1.75;}
.cta-card{background:var(--primary-light);border-radius:var(--radius-xl);padding:1.5rem;margin-bottom:1rem;}
.cta-title{font-size:15px;font-weight:700;color:var(--primary-dark);margin-bottom:5px;}
.cta-body{font-size:13px;color:#185FA5;line-height:1.7;margin-bottom:1rem;}
.cta-btn{background:#06C755;color:white;border:none;border-radius:var(--radius-sm);padding:11px 24px;font-size:14px;font-family:'Noto Sans JP',sans-serif;font-weight:500;cursor:pointer;width:100%;transition:background 0.15s;}
.cta-btn:hover{background:#05a847;}
.support-card{background:var(--teal-light);border:0.5px solid var(--teal-border);border-radius:var(--radius-xl);padding:1.5rem;margin-bottom:1rem;}
.support-title{font-size:15px;font-weight:700;color:var(--teal);margin-bottom:8px;}
.support-body{font-size:13px;color:var(--teal);line-height:1.8;margin-bottom:0.75rem;}.line-btn{background:#06C755;color:white;border:none;border-radius:var(--radius-sm);padding:11px 24px;font-size:14px;font-family:'Noto Sans JP',sans-serif;font-weight:500;cursor:pointer;width:100%;transition:background 0.15s;}.line-btn:hover{background:#05a847;}
.share-row{display:flex;gap:8px;margin-bottom:0.75rem;}
.share-btn{flex:1;background:white;border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:11px 8px;font-size:13px;font-family:'Noto Sans JP',sans-serif;color:var(--text-secondary);cursor:pointer;text-align:center;transition:background 0.15s;}
.share-btn:hover{background:var(--border-light);}
.retry-btn{background:transparent;border:none;font-size:13px;color:var(--text-tertiary);cursor:pointer;display:block;text-align:center;width:100%;padding:0.5rem;font-family:'Noto Sans JP',sans-serif;}
.retry-btn:hover{color:var(--text-secondary);}
@media(max-width:400px){.q-text{font-size:16px;}}
</style>
</head>

<script>
const AGE_GROUPS={baby:{label:"0〜1歳",sub:"ねんね〜あんよ期",questions:[{text:"赤ちゃんの様子で当てはまるものは？",choices:[{text:"音楽が流れると体を動かしたり反応する",s:{rhythm:3}},{text:"人の顔をじっと見て笑いかけるのが好き",s:{social:3}},{text:"手足をよく動かしてバタバタ元気",s:{body:3}},{text:"発達面で気になることがある・サポートが必要",s:{support:3}}]},{text:"親御さんが一緒にやりたいことは？",choices:[{text:"赤ちゃんと一緒に音楽やリズムを楽しみたい",s:{rhythm:3}},{text:"スキンシップや体のふれあいを大切にしたい",s:{body:3}},{text:"発達をサポートしながら関わりたい",s:{support:3}},{text:"外の世界とつながり親子で楽しみたい",s:{social:3}}]}]},toddler:{label:"2〜3歳",sub:"よちよち〜やんちゃ期",questions:[{text:"お子さんが一番好きな遊びは？",choices:[{text:"音楽に合わせて踊ったり歌ったりする",s:{rhythm:3,expr:1}},{text:"走り回ったりジャンプしたり体を動かす",s:{body:3,sport:1}},{text:"積み木やパズルなど手先を使う遊び",s:{calm:3,art:1}},{text:"発達面で気になることがある",s:{support:3}}]},{text:"気持ちの表現はどちらに近い？",choices:[{text:"体全体で表現する（踊る・叫ぶ・ジャンプ）",s:{body:2,expr:2}},{text:"言葉や声でよく話す・歌う",s:{expr:3,rhythm:1}},{text:"じっと観察してからゆっくり行動",s:{calm:3}},{text:"特定の感覚や刺激に強い反応がある",s:{support:3}}]},{text:"音楽が流れるとどんな反応？",choices:[{text:"すぐリズムをとったり踊り始める",s:{rhythm:3,body:1}},{text:"好きな曲を何度もリピートしたがる",s:{calm:2,rhythm:1}},{text:"あまり反応しない・苦手な音がある",s:{support:2}},{text:"歌いながら物語を作り始める",s:{expr:3,art:1}}]},{text:"お子さんの一番の強みは？",choices:[{text:"感受性が豊かで音楽や音に敏感",s:{rhythm:3,art:1}},{text:"体の動きが活発でエネルギーがある",s:{body:3,sport:1}},{text:"自分のペースで集中して取り組む",s:{calm:3}},{text:"人懐っこくてコミュニケーションが上手",s:{social:3,expr:1}}]}]},preschool:{label:"4〜6歳",sub:"幼稚園・保育園期",questions:[{text:"お子さんが一番イキイキする瞬間は？",choices:[{text:"音楽が流れると体が自然に動いている",s:{rhythm:3,expr:1}},{text:"絵や工作に夢中で時間を忘れている",s:{art:3,calm:1}},{text:"友だちと一緒にゲームや遊びを楽しむ",s:{social:3,sport:1}},{text:"発達面が気になる・こだわりや感覚過敏がある",s:{support:3}}]},{text:"気持ちを表現するとき、どちらに近い？",choices:[{text:"体全体で表現する（踊る・ジャンプ）",s:{body:2,rhythm:2}},{text:"言葉や声でよく話す",s:{expr:3,social:1}},{text:"絵や文字に書いて表す",s:{art:3,calm:1}},{text:"感情のコントロールが難しいことがある",s:{support:2,expr:1}}]},{text:"どんな遊びが好き？",choices:[{text:"かけっこや体を動かす遊び",s:{sport:3,body:1}},{text:"おままごとや役になりきる遊び",s:{expr:3,social:1}},{text:"積み木やパズルなど集中する遊び",s:{calm:3,art:1}},{text:"みんなで一緒にやる遊びが好き",s:{social: function renderAge(){
  document.getElementById('app').innerHTML=`
    <div class="age-intro">
      <img src="images/top.png" alt="" onerror="this.style.display='none'"
           style="width:100%;max-width:280px;border-radius:16px;margin-bottom:1.25rem;display:block;margin-left:auto;margin-right:auto;">
      <div class="age-intro-title">お子さんの<br>個性・才能診断</div>
      <div class="age-intro-sub">8つの才能タイプから、お子さんにぴったりの<br>習い事をご提案します。</div>
    </div>
    <div style="font-size:12px;color:var(--text-tertiary);margin-bottom:10px;text-align:center;">お子さんの年齢を選んでください</div>
    <div class="age-grid">
      ${Object.entries(AGE_GROUPS).map(([k,g])=>`<button class="age-btn" onclick="startAge('${k}')"><span class="age-main">${g.label}</span><span class="age-sub">${g.sub}</span></button>`).join('')}
    </div>
    <div style="font-size:12px;color:var(--text-tertiary);text-align:center;margin-top:1rem;line-height:1.7;">尾道市・福山市の総合ならいごと教室<br>おたまじゃくし</div>`;
}

function startAge(key){ageGroup=key;cur=0;ans=new Array(AGE_GROUPS[key].questions.length).fill(null);renderQ();}

function renderQ(){
  const qs=AGE_GROUPS[ageGroup].questions;const q=qs[cur];const pct=Math.round(((cur+1)/qs.length)*100);
  document.getElementById('app').innerHTML=`
    <div class="q-header"><span class="q-label">${AGE_GROUPS[ageGroup].label} · 個性才能診断</span><span class="q-label">${cur+1} / ${qs.length}</span></div>
    <div class="prog-bg"><div class="prog-fill" style="width:${pct}%"></div></div>
    <div class="q-text">${q.text}</div>
    <div class="choices">${q.choices.map((c,i)=>`<button class="choice-btn${ans[cur]===i?' sel':''}" onclick="pick(${i})">${c.text}</button>`).join('')}</div>
    <div class="nav">
      <button class="nav-btn" onclick="goBack()">${cur===0?'← 年齢選択':'← もどる'}</button>
      <button class="nav-btn primary" onclick="nextQ()" ${ans[cur]===null?'disabled':''}>${cur===qs.length-1?'結果を見る →':'つぎへ →'}</button>
    </div>`;
}

function renderResult(){
  const key=topType();const isBaby=(ageGroup==='baby');const isSupport=(key==='support');
  const base=TYPE_BASE[key];const label=isBaby?(BABY_LABELS[key]||BABY_LABELS.rhythm):base.label;
  const resultData=RESULT_MAP[key]?.[ageGroup];const lessons=resultData?.lessons||[];const other=resultData?.other||[];
  const iconName=isBaby?'ti-baby-carriage':base.icon;const colorClass=isSupport?'teal':'blue';
  document.getElementById('app').innerHTML=`
    <div class="result-hero">
      <div class="result-top">
        <div class="result-icon ${colorClass}">
          <img src="images/characters/${key}.png" alt="${label}"
               style="width:48px;height:48px;border-radius:50%;object-fit:cover;"
               onerror="this.outerHTML='<i class=\\'ti ${iconName}\\'></i>'">
        </div>
        <div><div class="result-badge ${colorClass}">診断結果 · ${AGE_GROUPS[ageGroup].label}</div><div class="result-type">${label}</div></div>
      </div>
      <div class="section"><div class="sec-label">才能・個性</div><div class="desc-text">${base.talent}</div></div>
      <div class="section"><div class="sec-label">詳しい特徴</div><div class="desc-text">${base.detail}</div></div>
      <div class="divider"></div>
      <div class="section"><div class="sec-label">親御さんへのアドバイス</div><div class="advice-box">${base.advice}</div></div>
      <div class="divider"></div>
      <div class="section">
        <div class="sec-label" style="margin-bottom:8px;">おすすめレッスン</div>
        <div style="font-size:11px;color:var(--text-tertiary);margin-bottom:6px;">おたまじゃくしのレッスン</div>
        <div class="lesson-tags" style="margin-bottom:10px;">${lessons.map(l=>`<span class="lt ${l.t}">${l.n}</span>`).join('')}</div>
        ${other.length?`<div style="font-size:11px;color:var(--text-tertiary);margin-bottom:6px;">その他おすすめ</div><div class="lesson-tags">${other.map(l=>`<span class="lt other">${l}</span>`).join('')}</div>`:''}
      </div>
      <div class="divider"></div>
      <div>
        <div class="sec-label" style="margin-bottom:10px;">このレッスンが向いている理由</div>
        ${lessons.map(l=>`<div class="reason-card"><div class="reason-name ${l.t==='gentle'?'teal':''}">${l.n}</div><div class="reason-body">${l.r}</div></div>`).join('')}
      </div>
    </div>
    ${isSupport?`<div class="support-card"><div class="support-title"><i class="ti ti-heart-handshake"></i> 発達サポートについて</div><div class="support-body">やさしいおとリトミック・個別セッションは<strong>資格を持つ音楽療法士</strong>が担当します。<br>その他のご不安やご相談がありましたら、お気軽にお声がけください。</div><div style=\"display:flex;flex-direction:column;gap:8px;margin-top:0.75rem;\"><button class=\"cta-btn\" onclick=\"window.open('https://lin.ee/Qaj3g3x','_blank')\">LINE で体験レッスンを申し込む</button><button class=\"line-btn\" onclick=\"window.open('https://lin.ee/Qaj3g3x','_blank')\">LINE でご相談・お問い合わせ</button></div></div></div>`:`<div class="cta-card"><div class="cta-title">おたまじゃくし 体験レッスン受付中</div><div class="cta-body">尾道市・福山市の総合ならいごと教室。リトミック・ダンス・バレエ・書道など多彩なレッスンが揃っています。まずは体験から！</div><button class="cta-btn" onclick="window.open('https://lin.ee/Qaj3g3x','_blank')">LINE で体験レッスンを申し込む</button></div>`}
    <div class="share-row">
      <button class="share-btn" onclick="doShare()"><i class="ti ti-share"></i> シェアする</button>
      <button class="share-btn" onclick="doCopy()"><i class="ti ti-copy"></i> コピーする</button>
    </div>
    <button class="retry-btn" onclick="restart()">もう一度診断する</button>`;
}

function pick(i){ans[cur]=i;renderQ();}
function goBack(){if(cur===0)renderAge();else{cur--;renderQ();}}
function nextQ(){if(ans[cur]===null)return;if(cur<AGE_GROUPS[ageGroup].questions.length-1){cur++;renderQ();}else renderResult();}
function doShare(){
  const key=topType();const isBaby=(ageGroup==='baby');
  const label=isBaby?(BABY_LABELS[key]||BABY_LABELS.rhythm):TYPE_BASE[key].label;
  const lessons=(RESULT_MAP[key]?.[ageGroup]?.lessons||[]).map(l=>l.n).slice(0,2).join('・');
  const text=`うちの子（${AGE_GROUPS[ageGroup].label}）は「${label}」でした！\n\n${TYPE_BASE[key].talent}\n\nおすすめレッスン：${lessons}\n\n#おたまじゃくし #子どもの才能診断 #習い事 #尾道\n\nhttps://otama-naraigoto.com/`;
  navigator.clipboard?.writeText(text).then(()=>alert('コピーしました！インスタのキャプションに貼り付けてシェアしてね✨'));
}
function doCopy(){doShare();}
function restart(){ageGroup=null;cur=0;ans=[];renderAge();}

renderAge();
</script>
</body>
</html>
